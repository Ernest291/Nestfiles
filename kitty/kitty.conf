# --- Fonts ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.0

# --- Window Layout ---
background_opacity         0.7
confirm_os_window_close    0
hide_window_decorations    yes
window_padding_width       0
draw_minimal_borders       yes
active_border_color #00ff00

# --- Tab Bar ---
tab_bar_style              powerline
tab_powerline_style        slanted
tab_bar_min_tabs           1
tab_bar_show_new_tab_button yes
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{secure_input_symbol}{fmt.fg.tab}{tab.last_focused_progress_percent}{title}"
active_tab_foreground   #000
active_tab_background   #eee
active_tab_font_style   bold-italic
inactive_tab_foreground #444
inactive_tab_background #999
inactive_tab_font_style normal

# --- Advanced & Mouse ---
enable_audio_bell          no
copy_on_select             no

# --- Tab Management ---
map ctrl+shift+\ launch --location=vsplit --cwd=current

# --- Startup ---
startup_session ~/.config/kitty/session.conf
allow_remote_control yes


